version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-afc
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@1234
      MYSQL_DATABASE: winamax
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: redis-afc
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  angular:
    build:
      context: ./FRONT
      dockerfile: Dockerfile
    container_name: angular-afc
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./FRONT:/app
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0"

volumes:
  mysql_data:
  redis_data:
